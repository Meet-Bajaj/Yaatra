services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: yaatri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: SuperSecurePassword1 23!
      POSTGRES_DB: yaatri
    ports:
      - "5432:5432"
    volumes:
      - yaatri-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d yaatri"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yaatri-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy volatile-ttl
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - yaatri-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: yaatri-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: MinioSecurePassword789!
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - yaatri-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  prisma-studio:
    image: node:20-alpine
    container_name: yaatri-prisma-studio
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command:
      - |
        npm install --omit=dev
        npx prisma generate
        exec npx prisma studio --port 5555 --browser none --url "postgresql://admin:SuperSecurePassword123!@postgres:5432/yaatri"
    ports:
      - "5555:5555"
    volumes:
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
      - ./backend/prisma:/app/prisma
      - prisma-studio-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  yaatri-pg-data:
  yaatri-redis-data:
  yaatri-minio-data:
  prisma-studio-node-modules:
